[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dotbot-install"
version = "0.2.0"
description = "A lifecycle-aware installer directive for Dotbot"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["dotbot>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["install"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
